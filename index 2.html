<title>Коммуналка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* base reset (hosted standalone page) */
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  [hidden] { display: none !important; }
  /* Layout: one narrow column (max 560px) with a bottom tab bar. "Сейчас" = a to-do list of payments; "За год" = chart + months; "Счета" = what you pay and how. */
  :root {
    --bg: #edf0f5;
    --surface: #ffffff;
    --surface-2: #f4f6fa;
    --line: #d8dee8;
    --ink: #142033;
    --dim: #5a6779;
    --accent: #2744d6;
    --accent-ink: #ffffff;
    --tile-bg: #e4eafc;
    --tile-ink: #2744d6;
    --ok: #1e7a4c;
    --ok-bg: #e1f3e9;
    --warn: #9a5b00;
    --warn-bg: #fcefd3;
    --bad: #bf2f25;
    --bad-bg: #fbe4e1;
    --scrim: rgba(10, 18, 30, 0.45);
    --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d141f; --surface: #151f2e; --surface-2: #1c283a; --line: #2a3850;
      --ink: #e8eef7; --dim: #97a5ba; --accent: #7e96ff; --accent-ink: #0d141f;
      --tile-bg: #22325a; --tile-ink: #a9b9ff;
      --ok: #5fd39a; --ok-bg: #133326; --warn: #f0b554; --warn-bg: #3a2a0e; --bad: #ff7b6e; --bad-bg: #3c1a18;
      --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d141f; --surface: #151f2e; --surface-2: #1c283a; --line: #2a3850;
    --ink: #e8eef7; --dim: #97a5ba; --accent: #7e96ff; --accent-ink: #0d141f;
    --tile-bg: #22325a; --tile-ink: #a9b9ff;
    --ok: #5fd39a; --ok-bg: #133326; --warn: #f0b554; --warn-bg: #3a2a0e; --bad: #ff7b6e; --bad-bg: #3c1a18;
    --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4;
    padding-block: 18px 104px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
  .muted { color: var(--dim); }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

  .top h1 { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em; }
  .top .date { margin: 4px 0 0; font-size: 13px; color: var(--dim); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
  .btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
  .btn.block { width: 100%; }

  .summary { border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
  .summary.bad { background: var(--bad-bg); color: var(--bad); }
  .summary.warn { background: var(--warn-bg); color: var(--warn); }
  .summary.ok { background: var(--ok-bg); color: var(--ok); }
  .summary strong { font-size: 22px; line-height: 1.2; font-weight: 700; }
  .summary span { font-size: 14px; }
  .banner { border-radius: 12px; padding: 10px 14px; font-size: 14px; background: var(--warn-bg); color: var(--warn); display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .banner.bad { background: var(--bad-bg); color: var(--bad); }
  .banner button { flex: none; background: transparent; border: 1px solid currentColor; border-radius: 10px; padding: 6px 10px; font-weight: 600; font-size: 13px; }

  .sec { display: flex; flex-direction: column; gap: 8px; }
  .sec > h2 { margin: 0; font-size: 17px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .sec > h2.sm { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
  .sec > h2 .cnt { font-family: var(--font-num); font-size: 14px; color: var(--dim); }
  .sec > p.sub { margin: -4px 0 2px; font-size: 13px; color: var(--dim); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .card > * + * { border-top: 1px solid var(--line); }
  .card.bad { border-color: var(--bad); }

  .tile { width: 40px; height: 40px; border-radius: 12px; background: var(--tile-bg); color: var(--tile-ink); display: grid; place-items: center; flex: none; }
  .tile svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tile.sm { width: 34px; height: 34px; border-radius: 10px; }
  .tile.sm svg { width: 19px; height: 19px; }

  .item { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .ihead { display: flex; gap: 12px; align-items: flex-start; width: 100%; background: none; border: 0; padding: 0; text-align: left; }
  .ihead.static { cursor: default; }
  .itext { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .iname { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
  .imeta { font-size: 13px; color: var(--dim); }
  .imeta.bad { color: var(--bad); } .imeta.warn { color: var(--warn); } .imeta.ok { color: var(--ok); }
  .iact { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .iact .amt { flex: 1; min-width: 100px; font-family: var(--font-num); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .iact input { flex: 1; min-width: 120px; }
  .iact.two .amt { flex: 1 0 100%; }
  .iact.two .btn { flex: 1; }
  .pill { align-self: flex-start; display: inline-flex; margin-top: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--dim); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }

  .line { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 16px; background: none; border: 0; text-align: left; min-height: 56px; }
  .line .amt { font-family: var(--font-num); font-weight: 700; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .line .amt.e { color: var(--dim); font-weight: 500; }

  .rd { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .rd-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rd-body { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .rd-body input { flex: 1; min-width: 140px; }
  .rd-warn { font-size: 13px; color: var(--warn); margin: 0; }
  .rd-foot { padding: 12px 16px; }
  .meter { display: inline-flex; gap: 2px; }
  .meter b { display: grid; place-items: center; width: 15px; height: 24px; border-radius: 3px; background: #1b2431; color: #f2f5fa; font: 500 14px var(--font-num); }
  .meter b.r { color: #ff7a6c; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label, .lbl { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
  input[type="text"], input[type="number"], input[type="date"], select { width: 100%; min-height: 46px; padding: 0 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
  input.big { font-family: var(--font-num); font-size: 18px; font-weight: 500; }
  .hint { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .check { display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 16px; cursor: pointer; }
  .check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
  .linkbtn { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 600; text-decoration: underline; font-size: 13px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .chip { flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }

    Object.keys(S.records).sort().forEach(function (k) { var r = S.records[k][id]; if (r && r.reading != null) arr.push({ key: k, val: r.reading }); });
    return arr;
  }
  function prevReading(id, key) {
    var arr = readingsFor(id), p = null;
    for (var i = 0; i < arr.length; i++) { if (arr[i].key < key) p = arr[i]; else break; }
    return p;
  }
  function nextDue(t) {
    var cur = keyOf(t), best = null, end = addMonths(cur, 2);
    S.services.forEach(function (s) {
      if (noPrice(s)) return;
      var k = s.from || cur, g = 0;
      while (k <= end && g++ < 240) {
        var st = statusOf(k, s, recOf(k, s.id), t);
        if (st.code === 'open' || st.code === 'soon') { if (!best || st.due < best.due) best = { svc: s, due: st.due }; break; }
        k = addMonths(k, 1);

    });
    return best;
  }
  function fmtNum(n, maxDec) { return Number(n).toLocaleString('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: maxDec == null ? 2 : maxDec }); }

  function describe(st) {

      case 'open': return { cls: '', txt: 'Осталось ' + days(st.days) };
      case 'ontime': return { cls: 'ok', txt: 'Оплачено вовремя' };
      case 'late': return { cls: 'warn', txt: 'Оплачено с опозданием на ' + days(st.days) };

  /* ---------- demo ---------- */
  function makeDemo() {
    var t = today(), cur = keyOf(t), prev = addMonths(cur, -1), y = t.getFullYear();
    var d = { v: 2, onboarded: true, name: 'Пример: квартира', currency: 'RSD', start: y + '-01', services: [], records: {} };
    var defs = [
      { id: 'e', name: 'Электричество', icon: 'power', kind: 'var', due: 15, off: 1, base: 3200 },
      { id: 'h', name: 'Центральное отопление', icon: 'heat', kind: 'var', due: 15, off: 1, base: 5400 },
      { id: 'w', name: 'Холодная вода', icon: 'water', kind: 'var', due: 15, off: 1, base: 1100 },
      { id: 't', name: 'Вывоз мусора', icon: 'trash', kind: 'fixed', due: 15, off: 1, price: 380 },
      { id: 'm', name: 'Управляющий домом и содержание дома', icon: 'house', kind: 'fixed', due: 15, off: 1, price: 2400, raise: [y + '-07', 2600] },
      { id: 'i', name: 'Интернет, телефон и ТВ', icon: 'net', kind: 'fixed', due: 15, off: 0, price: 3200 },
      { id: 'a', name: 'Мобильный Анна', icon: 'phone', kind: 'fixed', due: 15, off: 0, price: 1200 },
      { id: 'p', name: 'Мобильный Пётр', icon: 'phone', kind: 'fixed', due: 15, off: 0, price: 1500 }
    ];
    defs.forEach(function (df) {
      var s = { id: df.id, name: df.name, icon: df.icon, kind: df.kind, unit: null, due: df.due, off: df.off, from: y + '-01', prices: [] };
      if (df.price) { s.prices.push({ from: y + '-01', amount: df.price }); if (df.raise) s.prices.push({ from: df.raise[0], amount: df.raise[1] }); }
      d.services.push(s);
    });
    var k = y + '-01', idx = 0;
    while (k <= cur) {
      var m = parseKey(k).m;
      d.services.forEach(function (svc, si) {
        var df = defs[si], rec = {};
        var season = df.id === 'h' ? (m < 3 || m > 9 ? 1.5 : 0.2) : 1 + 0.12 * Math.sin(idx + si);
        if (svc.kind === 'var' && k < cur) rec.amount = Math.round(df.base * season / 10) * 10;
        var due = dueDate(k, svc);
        var billed = svc.kind === 'fixed' || rec.amount != null;
        var skipPay = (df.id === 'e' && k === prev) || (df.id === 'w' && k === prev);
        if (billed && !skipPay && dayDiff(t, due) >= 1) {
          var shift = (idx + si) % 7 === 3 ? 3 : -2;
          var pd = new Date(due.getFullYear(), due.getMonth(), due.getDate() + shift);
          if (pd > t) pd = t;
          rec.paid = isoOf(pd);
        }
        if (df.id === 'w' && k === prev) delete rec.amount;
        if (rec.amount != null || rec.paid) { if (!d.records[k]) d.records[k] = {}; d.records[k][svc.id] = rec; }
      });
      k = addMonths(k, 1); idx++;
    }
    return d;
  }

  function monthItems(key, t) {

      var rec = recOf(key, s.id), tracked = ((s.from || cur) <= key && key <= cur) || rec;

  function monthSummary(list) {
    var c = { over: 0, late: 0, ok: 0, pend: 0, total: 0, n: 0 };
    list.forEach(function (i) {
      if (i.st.code === 'skip') return;
      c.n++; if (i.amt != null) c.total += i.amt;
      if (i.st.code === 'overdue') c.over++; else if (i.st.code === 'late') c.late++; else if (i.st.code === 'ontime') c.ok++; else c.pend++;
    });
    var parts = [];
    if (c.over) parts.push('Просрочено: ' + c.over);
    if (c.pend) parts.push('Ждёт оплаты: ' + c.pend);
    if (c.late) parts.push('С опозданием: ' + c.late);
    if (!parts.length && c.n) parts.push('Всё вовремя');
    c.txt = parts.join(' · ');
    c.cls = c.over ? 'bad' : c.late ? 'warn' : c.pend ? 'pend' : c.n ? 'ok' : '';
    return c;
  }

    if (rh) h += '<section class="sec"><h2>Показания счётчиков</h2><div class="card">' + rh + '</div></section>';
    return h;
  }

  function settingsHTML() {

      '<div class="field" id="f-paidrow"' + (rec.paid ? '' : ' hidden') + '><label for="f-paiddate">Дата оплаты</label><input type="date" id="f-paiddate" value="' + (rec.paid || isoOf(t)) + '"></div>' +
      '<label class="check"><input type="checkbox" id="f-skip"' + (rec.skip ? ' checked' : '') + '><span>Счёта за этот месяц нет</span></label>' +
      '<div class="acts"><button class="btn primary block" data-a="saveEntry">Сохранить</button>' +
      (recOf(key, svc.id) ? '<button class="btn danger block" data-a="delEntry">Очистить запись за месяц</button>' : '') + '</div></div>';

      '<div class="field"><span class="lbl">Сумма</span><div class="seg"><label><input type="radio" name="s-kind" value="var"' + (fixed ? '' : ' checked') + '><span>Каждый месяц разная</span></label><label><input type="radio" name="s-kind" value="fixed"' + (fixed ? ' checked' : '') + '><span>Всегда одна и та же</span></label></div></div>' +

      '<div class="field"><label for="s-pfrom">Действует с месяца</label><select id="s-pfrom">' + opts + '</select><p class="note">Если сумма изменилась, введите новую и выберите месяц, с которого она действует. Прошлые месяцы останутся со старой суммой.</p></div></div>' +
      '<div class="field"><label for="s-due">Оплатить до числа</label><input type="number" inputmode="numeric" min="1" max="31" id="s-due" class="big" value="' + (s.due || 15) + '"></div>' +
      '<div class="field"><label for="s-off">Счёт приходит</label><select id="s-off"><option value="1"' + (s.off ? ' selected' : '') + '>за прошлый месяц (оплата в следующем)</option><option value="0"' + (s.off ? '' : ' selected') + '>за этот же месяц</option></select>' +
      '<p class="note" id="s-offhint"></p></div>' +

  function updateOffHint() {
    var el = $('#s-offhint'); if (!el) return;
    var due = parseInt(($('#s-due') || {}).value, 10) || 15, off = +$('#s-off').value;
    var t = today(), k = addMonths(keyOf(t), -1), p = parseKey(addMonths(k, off));
    el.textContent = 'Например, счёт за ' + MON[parseKey(k).m] + ' нужно оплатить до ' + Math.min(due, daysIn(p.y, p.m)) + ' ' + MON_GEN[p.m] + '.';

  function toast(msg, undo) {
    var el = $('#toast');
    el.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button data-a="undo">Отменить</button>' : '');
    el.hidden = false; el._undo = undo || null;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; el._undo = null; }, undo ? 6000 : 2600);
  }

  /* ---------- actions ---------- */
  function saveEntry() {
    var svc = svcById(sheet.svcId), key = sheet.key, rec = {};
    var rd = $('#f-reading'), am = $('#f-amount');
    if (rd) {
      var rv = parseNum(rd.value);
      if (rv != null) {
        var pr = prevReading(svc.id, key);
        if (pr && rv < pr.val && !sheet.force) {
          var w = $('#f-rwarn'); w.textContent = 'Меньше предыдущего показания (' + fmtNum(pr.val, 3) + '). Проверьте число. Если всё верно, нажмите «Сохранить» ещё раз.'; w.hidden = false; sheet.force = true; return;
        }
        rec.reading = rv;
      }
    }
    var av = parseNum(am.value);
    if (av != null && !(svc.kind === 'fixed' && av === priceAt(svc, key))) rec.amount = av;
    if ($('#f-skip').checked) rec.skip = true;
    if ($('#f-paid').checked) rec.paid = $('#f-paiddate').value || isoOf(today());
    setRec(key, svc.id, rec);
    persist(); closeSheet(); render(); toast('Сохранено');
  }
  function saveSvc() {
    var s = sheet.svc, name = $('#s-name').value.trim(), due = parseInt($('#s-due').value, 10);
    if (!name) { $('#s-name').focus(); return; }
    if (!(due >= 1 && due <= 31)) { $('#s-due').focus(); return; }
    var kind = document.querySelector('input[name="s-kind"]:checked').value;
    var ic = document.querySelector('input[name="s-icon"]:checked');
    s.name = name; s.due = due; s.off = +$('#s-off').value; s.kind = kind; s.icon = ic ? ic.value : (s.icon || 'other');
    s.unit = $('#s-meter').checked ? ($('#s-unit').value.trim() || 'м³') : null;
    if (kind === 'fixed') {
      var v = parseNum($('#s-amount').value);
      if (v != null) {
        var pf = $('#s-pfrom').value;
        if (!s.prices.length || priceAt(s, pf) !== v) {
          var found = false;
          s.prices.forEach(function (e) { if (e.from === pf) { e.amount = v; found = true; } });
          if (!found) s.prices.push({ from: pf, amount: v });
          s.prices.sort(function (a, b) { return a.from < b.from ? -1 : 1; });
        }
      }
    }
    if (sheet.isNew) S.services.push(s);
    persist(); closeSheet(); render(); toast('Сохранено');
  }
  function openEntry(key, svcId) { if (svcById(svcId)) openSheet({ type: 'entry', key: key, svcId: svcId }); }
  function openSvc(s, isNew) { openSheet({ type: 'svc', svc: s, isNew: isNew }); updateOffHint(); }
  function newSvcFrom() { var c = keyOf(today()), a = addMonths(c, -1); return S.start > a ? S.start : a; }

  var actions = {
    tab: function (el) { view = el.getAttribute('data-v'); render(); window.scrollTo(0, 0); },
    edit: function (el) { openEntry(el.getAttribute('data-key'), el.getAttribute('data-svc')); },
    pay: function (el) {
      var key = el.getAttribute('data-key'), id = el.getAttribute('data-svc');
      var before = recOf(key, id), snap = before ? JSON.parse(JSON.stringify(before)) : null;
      var rec = before ? JSON.parse(JSON.stringify(before)) : {};
      rec.paid = isoOf(today()); delete rec.skip;
      setRec(key, id, rec); persist(); render();
      toast('Отмечено: оплачено сегодня', function () { setRec(key, id, snap); persist(); render(); });
    },
    payOnTime: function (el) {
      var key = el.getAttribute('data-key'), id = el.getAttribute('data-svc'), svc = svcById(id);
      var before = recOf(key, id), snap = before ? JSON.parse(JSON.stringify(before)) : null;
      var rec = before ? JSON.parse(JSON.stringify(before)) : {};
      rec.paid = isoOf(dueDate(key, svc)); delete rec.skip;
      setRec(key, id, rec); persist(); render();
      toast('Отмечено: оплачено в срок', function () { setRec(key, id, snap); persist(); render(); });
    },
    quickAmt: function (el) {
      var key = el.getAttribute('data-key'), id = el.getAttribute('data-svc'), inp = document.getElementById('qa-' + id + '-' + key);
      var v = parseNum(inp && inp.value);
      if (v == null) { if (inp) inp.focus(); return; }
      var rec = JSON.parse(JSON.stringify(recOf(key, id) || {})); rec.amount = v;
      setRec(key, id, rec); persist(); render(); toast('Сумма внесена');
    },
    setPrice: function (el) {
      var id = el.getAttribute('data-svc'), s = svcById(id), inp = document.getElementById('qp-' + id);
      var v = parseNum(inp && inp.value);
      if (v == null) { if (inp) inp.focus(); return; }
      s.prices = [{ from: s.from || keyOf(today()), amount: v }];
      persist(); render(); toast('Сумма сохранена');
    },
    undo: function () { var el = $('#toast'), u = el._undo; el.hidden = true; el._undo = null; if (u) u(); },
    saveReadings: function () {
      var cur = keyOf(today()), n = 0, warn = false;
      S.services.forEach(function (s) {
        var inp = $('#rd-' + s.id); if (!inp) return;
        var v = parseNum(inp.value); if (v == null) return;
        var pr = prevReading(s.id, cur), w = $('#rw-' + s.id);
        if (pr && v < pr.val && !forceRead) { w.textContent = 'Меньше предыдущего (' + fmtNum(pr.val, 3) + '). Проверьте число.'; w.hidden = false; warn = true; return; }
        var rec = JSON.parse(JSON.stringify(recOf(cur, s.id) || {})); rec.reading = v; setRec(cur, s.id, rec); n++;
      });
      if (warn) { forceRead = true; var b = $('[data-a="saveReadings"]'); if (b) b.textContent = 'Всё равно сохранить'; if (!n) return; }
      if (n) { forceRead = false; persist(); render(); toast('Показания сохранены'); }
      else if (!warn) toast('Введите хотя бы одно показание');
    },
    year: function (el) { histYear += +el.getAttribute('data-d'); openMonth = null; render(); },
    pickMonth: function (el) {
      openMonth = el.getAttribute('data-key'); render();
      var t = document.getElementById('m-' + openMonth); if (t && t.scrollIntoView) t.scrollIntoView({ block: 'center' });
    },

    closeSheet: closeSheet,
    period: function (el) { sheet.key = addMonths(sheet.key, +el.getAttribute('data-d')); sheet.force = false; renderSheet(); },
    saveEntry: saveEntry,
    delEntry: function () { setRec(sheet.key, sheet.svcId, null); persist(); closeSheet(); render(); toast('Запись очищена'); },
    priceFromEntry: function () { var s = svcById(sheet.svcId); closeSheet(); if (s) openSvc(s, false); },
    editSvc: function (el) { openSvc(svcById(el.getAttribute('data-svc')), false); },
    addSvc: function () { openSvc({ id: uid(), name: '', icon: 'other', kind: 'var', unit: null, due: 15, off: 1, from: newSvcFrom(), prices: [] }, true); },
    saveSvc: saveSvc,
    delSvc: function (el) {
      if (!sheet.arm) { sheet.arm = true; el.textContent = 'Нажмите ещё раз: удалить счёт и его записи'; return; }
      var id = sheet.svc.id;
      S.services = S.services.filter(function (s) { return s.id !== id; });
      Object.keys(S.records).forEach(function (k) { delete S.records[k][id]; if (!Object.keys(S.records[k]).length) delete S.records[k]; });
      persist(); closeSheet(); render(); toast('Счёт удалён');
    },
    cur: function (el) { S.currency = el.getAttribute('data-c'); persist(); render(); },
    applyStart: function () {
      var v = $('#startSel').value; S.start = v; S.services.forEach(function (s) { s.from = v; });
      persist(); render(); toast('Учёт ведётся с ' + monthYear(v));
    },
    wipe: function () {
      if (!delArm) { delArm = true; clearTimeout(delTimer); delTimer = setTimeout(function () { delArm = false; if (view === 'settings' && !sheet) render(); }, 5000); render(); return; }
      delArm = false; S = emptyState(); view = 'home'; persist(); render();
    },
    demo: function () { if (demo) return; backup = S; S = makeDemo(); demo = true; view = 'home'; openMonth = keyOf(today()); closeSheet(); render(); window.scrollTo(0, 0); },
    exitDemo: function () { demo = false; S = backup || emptyState(); backup = null; closeSheet(); render(); },
    retrySave: function () { flush(); },
    exportBackup: function () {
      if (demo) { toast('В режиме примера копию сохранить нельзя'); return; }
      var blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kommunalka-' + isoOf(today()) + '.json';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      toast('Копия сохранена в загрузки');
    },
    importPick: function () { if (demo) { toast('Сначала выйдите из режима примера'); return; } $('#importFile').click(); },
    importApply: function () { if (!pendingImport) return; S = pendingImport; pendingImport = null; persist(); view = 'home'; render(); window.scrollTo(0, 0); toast('Данные загружены'); },
    importCancel: function () { pendingImport = null; render(); },
    obCur: function (el) { qsa('[data-a="obCur"]').forEach(function (b) { b.setAttribute('aria-pressed', b === el ? 'true' : 'false'); }); },
    obDone: function () {
      var startKey = keyOf(today());
      var sel = document.querySelector('input[name="obStart"]:checked');
      if (sel && sel.value === '-1') startKey = addMonths(startKey, -1);
      var curBtn = document.querySelector('[data-a="obCur"][aria-pressed="true"]');
      var svcs = [];
      PRESETS.forEach(function (p, i) {
        if (!$('#ob-on-' + i).checked) return;
        var due = parseInt($('#ob-due-' + i).value, 10); if (!(due >= 1 && due <= 31)) due = p.due;
        var off = +$('#ob-off-' + i).value;
        function mk(name) { return { id: uid(), name: name, icon: p.icon, kind: p.kind, unit: null, due: due, off: off, from: startKey, prices: [] }; }
        if (p.people) {
          var names = $('#ob-names').value.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
          if (!names.length) svcs.push(mk('Мобильный телефон'));
          names.forEach(function (n) { svcs.push(mk('Мобильный ' + n)); });
        } else svcs.push(mk(p.name));
      });
      S.services = svcs; S.start = startKey; S.currency = curBtn ? curBtn.getAttribute('data-c') : S.currency; S.onboarded = true;
      persist(); view = 'home'; render(); window.scrollTo(0, 0);
    }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-a]') : null;
    if (!el) return;
    var fn = actions[el.getAttribute('data-a')];
    if (fn) fn(el, e);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheet) { closeSheet(); return; }
    if (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT' && e.target.type === 'text') {
      var btn = e.target.parentNode && e.target.parentNode.querySelector('button[data-a]');
      if (btn) { e.preventDefault(); btn.click(); }
    }
  });
  document.addEventListener('change', function (e) {
    var id = e.target.id, nm = e.target.name;
    if (id === 'f-paid') { $('#f-paidrow').hidden = !e.target.checked; if (e.target.checked && !$('#f-paiddate').value) $('#f-paiddate').value = isoOf(today()); }
    else if (id === 's-meter') { $('#s-unitrow').hidden = !e.target.checked; }
    else if (nm === 's-kind') { $('#s-fixedrow').hidden = e.target.value !== 'fixed'; }
    else if (id === 's-off') { updateOffHint(); }
    else if (id === 'curIn') { S.currency = e.target.value.trim() || 'RSD'; persist(); render(); }
    else if (id === 'homeName') { S.name = e.target.value.trim(); persist(); }
    else if (id === 'importFile') {
      var f = e.target.files && e.target.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try { var o = JSON.parse(rd.result); if (!o || !Array.isArray(o.services) || typeof o.records !== 'object' || !o.records) throw new Error('bad'); pendingImport = migrate(o); }
        catch (x) { pendingImport = null; toast('Не удалось прочитать файл копии'); }
        render();
      };
      rd.onerror = function () { toast('Не удалось прочитать файл копии'); };
      rd.readAsText(f); e.target.value = '';
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id && e.target.id.indexOf('rd-') === 0) forceRead = false;
    if (e.target.id === 'f-reading' && sheet) sheet.force = false;
    if (e.target.id === 's-due') updateOffHint();
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S && !sheet && !typing()) render(); });

  /* ---------- boot ---------- */
  function boot() {
    mode = 'local'; S = loadLocal();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    render();
  }
  boot();
})();
</script>
</body>
</html>
